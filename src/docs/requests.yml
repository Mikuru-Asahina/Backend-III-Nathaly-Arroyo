components:
  parameters:
    schemas:

      UserInput:
        type: object
        required:
          - first_name
          - last_name
          - email
          - age
          - password
        properties:
          first_name:
            type: string
            description: Nombre del usuario.
            example: Nathaly
          last_name:
            type: string
            description: Apellido del usuario.
            example: Pérez
          email:
            type: string
            description: Correo electrónico del usuario.
            example: nathaly@mail.com
          age:
            type: integer
            description: Edad del usuario (mínimo 18).
            example: 25
          password:
            type: string
            description: Password del usuario.
            example: coder123
          role:
            type: string
            description: Rol del usuario.
            enum: [user, admin]
            example: user


      UserUpdateInput:
        type: object
        properties:
          first_name:
            type: string
            description: Nombre del usuario.
            example: Nathaly
          last_name:
            type: string
            description: Apellido del usuario.
            example: Pérez
          email:
            type: string
            description: Correo electrónico del usuario.
            example: nathaly@mail.com
          age:
            type: integer
            description: Edad del usuario.
            example: 26
          password:
            type: string
            description: Password del usuario.
            example: coder123
          role:
            type: string
            enum: [user, admin]
            description: Rol del usuario.
            example: admin
